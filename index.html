<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111210">
  <meta name="description" content="Explore the Nissan Skyline R34 LBWK in an interactive 3D showroom.">
  <title>Nissan Skyline R34 LBWK — Vancy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; font-family: Geist, sans-serif; color: #f0efe9; background: #111210; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { max-width: 1440px; margin: auto; padding: 0 clamp(20px, 5vw, 76px); }
    header, footer, .viewer-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header { min-height: 70px; border-bottom: 1px solid #35362f; }
    .brand { font-weight: 700; letter-spacing: .24em; }
    a { color: #c1c2b8; text-underline-offset: 4px; }
    a:hover { color: #ecff6b; }
    main { padding-block: clamp(36px, 6vw, 76px) 26px; }
    .eyebrow { margin: 0 0 8px; color: #ecff6b; font-size: .75rem; font-weight: 700; letter-spacing: .20em; text-transform: uppercase; }
    h1 { margin: 0 0 24px; font: 800 clamp(3.1rem, 10vw, 9.5rem)/.82 'Barlow Condensed', Impact, sans-serif; letter-spacing: -.025em; text-transform: uppercase; }
    h1 span { color: #ecff6b; }
    .viewer { overflow: hidden; border: 1px solid #424337; background: #1d1e19; }
    iframe { display: block; width: 100%; height: clamp(330px, 58vh, 740px); border: 0; }
    .viewer-bar { padding: 12px 16px; border-top: 1px solid #424337; flex-wrap: wrap; }
    .viewer-bar p, footer { color: #c1c2b8; font-size: .78rem; }
    .viewer-bar p { margin: 0; }
    button { background: #ecff6b; color: #161810; padding: 9px 13px; border: 0; font: 700 .75rem Geist, sans-serif; cursor: pointer; }
    :focus-visible { outline: 2px solid #ecff6b; outline-offset: 4px; }
    footer { padding-bottom: 24px; }
    .viewer:fullscreen { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
    .viewer:fullscreen iframe { height: 100%; }
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand">VANCY</div><a href="#showroom">3D Showroom</a></header>
    <main>
      <p class="eyebrow">Nissan · Liberty Walk</p>
      <h1>Skyline <span>R34</span></h1>
      <section class="viewer" id="showroom" aria-label="Interactive Nissan Skyline R34 model">
        <iframe title="Nissan Skyline R34 LB Silhouette interactive model" src="https://sketchfab.com/models/e53f1d3d9c6042aeaf9846035111a4cd/embed?autostart=1&amp;dnt=1" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
        <div class="viewer-bar">
          <p>Drag to rotate · Scroll or pinch to zoom</p>
          <button id="fullscreen" type="button" hidden>Fullscreen</button>
        </div>
      </section>
    </main>
    <footer><span>2002 Skyline GT-R · LB Silhouette</span><a href="https://sketchfab.com/3d-models/2002-nissan-skyline-gt-r34-lb-silhouette-e53f1d3d9c6042aeaf9846035111a4cd">Model on Sketchfab</a></footer>
  </div>
  <script>
    const viewer = document.querySelector('.viewer');
    const fullscreen = document.querySelector('#fullscreen');
    if (document.fullscreenEnabled) {
      fullscreen.hidden = false;
      fullscreen.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await viewer.requestFullscreen();
        } catch {
          fullscreen.textContent = 'Fullscreen unavailable';
        }
      });
      document.addEventListener('fullscreenchange', () => {
        fullscreen.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      });
    }
  </script>
</body>
</html>
